detection:
  confidence_threshold: 0.25
  iou_threshold: 0.45
  # VLM输出置信度过滤阈值（低于此值的结果将被过滤）
  vlm_confidence_threshold: 0.1

# 模型配置（各Task使用的模型路径）
models:
  # Task1: 抛洒物检测
  task1:
    model_path: ""           # YOLO模型路径，为空则使用VLM
    conf_threshold: 0.25
    iou_threshold: 0.45
    # 图像切片推理参数（提升小目标检测）
    use_tiled_inference: true    # 是否启用切片推理
    tile_size: 640               # 切片尺寸（像素）
    tile_overlap: 0.2           # 切片重叠比例
    merge_iou_threshold: 0.001     # 合并检测结果时的IOU阈值
    max_workers: 8              # 并发线程数（加速切片推理）
    use_rag: false              # 是否启用RAG知识库（关闭以加速）

  # Task2: 路面病害检测（路面裂缝/坑洼/积水/护栏破损）
  task2:
    model_path: ""           # YOLO/分割模型路径，为空则使用VLM
    conf_threshold: 0.25
    iou_threshold: 0.45
    # 默认切片推理参数（未单独配置的scene_id使用此配置）
    use_tiled_inference: true    # 是否启用切片推理
    tile_size: 1280              # 切片尺寸（像素）
    tile_overlap: 0.1            # 切片重叠比例
    merge_iou_threshold: 0.001   # 合并检测结果时的IOU阈值
    max_workers: 8               # 并发线程数（加速切片推理）
    use_rag: false               # 是否启用RAG知识库（关闭以加速）
    # 按scene_id单独配置切片（覆盖默认配置）
    # scene_id: 1=裂缝, 2=坑洼, 3=积水, 4=护栏破损
    scene_configs:
      1:  # 路面裂缝 - 裂缝通常较细长，切片可能导致断裂，建议不切片
        use_tiled_inference: false
      2:  # 路面坑洼 - 小目标坑洼适合切片检测
        use_tiled_inference: true
        tile_size: 640
        tile_overlap: 0.2
      3:  # 路面积水 - 积水范围较大，不需要切片
        use_tiled_inference: false
      4:  # 护栏破损 - 小目标护栏适合切片检测
        use_tiled_inference: true
        tile_size: 640
        tile_overlap: 0.2

  # Task3: 路外病害检测（边坡破损/排水沟积水/排水沟破损）
  task3:
    model_path: ""           # YOLO模型路径，为空则使用VLM
    conf_threshold: 0.25
    iou_threshold: 0.45
    # 默认切片推理参数（未单独配置的scene_id使用此配置）
    use_tiled_inference: false   # 是否启用切片推理
    tile_size: 1280              # 切片尺寸（像素）
    tile_overlap: 0.1            # 切片重叠比例
    merge_iou_threshold: 0.001   # 合并检测结果时的IOU阈值
    max_workers: 8               # 并发线程数（加速切片推理）
    use_rag: false               # 是否启用RAG知识库（关闭以加速）
    # 按scene_id单独配置切片（覆盖默认配置）
    # scene_id: 5=边坡破损, 6=排水沟积水, 7=排水沟破损
    scene_configs:
      5:  # 边坡破损 - 范围较大，不需要切片
        use_tiled_inference: false
      6:  # 排水沟积水 - 边缘区域小目标，适合切片
        use_tiled_inference: false
      7:  # 排水沟破损 - 边缘区域小目标，适合切片
        use_tiled_inference: true
        tile_size: 640
        tile_overlap: 0.2

# 视频处理配置（针对token限制优化）
video:
  max_frames: 3          # 提取帧数（建议2-4帧，受限于max_model_len）
  frame_max_size: 1920   # 帧图片最大边长（像素）
  frame_quality: 100     # JPEG编码质量（1-100）
  batch_mode: false      # 是否分批处理（逐帧分析后汇总）

logging:
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: INFO
scenes:
  0: 路面抛洒物
  1: 路面裂缝
  2: 路面坑洼
  3: 路面积水
  4: 护栏破损
  5: 边坡滑坡
  6: 排水沟积水
  7: 排水沟破损
server:
  host: 0.0.0.0
  port: 8000
